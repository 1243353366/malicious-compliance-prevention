version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: malicious_compliance_postgres
    environment:
      POSTGRES_DB: malicious_compliance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d malicious_compliance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
